[package]
name = "tvm-tirx-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tvm_tirx_ext"
# The shared library is the one `import tvm_tirx` loads, installed as `libtvm_tirx_rust`.
crate-type = ["rlib", "cdylib"]

[dependencies]
linkme = "0.3"
tvm-ffi.workspace = true
tvm-tirx.workspace = true

# A library of operators and a type defined in Rust, which `tests/python/ir/test_op_rust.py` loads.
[[example]]
name = "define_ir"
crate-type = ["cdylib"]
