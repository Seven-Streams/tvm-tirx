# The Rust crates of TIRx, a standalone workspace: not a member of any enclosing one.
#
# - `tvm-tirx` binds the compiler objects of `libtvm_tirx_compiler` over TVM FFI.
# - `tvm-tirx-ext` extends TIRx from Rust: operators and IR types defined in `register_ops!` and
#   `register_types!` blocks, and the shared library `import tvm_tirx` loads.
[workspace]
members = ["tvm-tirx", "tvm-tirx-ext"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
# The oldest toolchain that builds the crates and tvm-ffi; CMake checks cargo against it.
rust-version = "1.84"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tvm-ffi = { path = "../3rdparty/tvm-ffi/rust/tvm-ffi" }
tvm-tirx = { path = "tvm-tirx" }
