name: Publish TIRx crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, branch, or SHA to build"
        required: true
        type: string
      wheel_run_id:
        description: "ID of the 'Publish TIRx wheels' run to test against (empty: the wheels on PyPI)"
        required: false
        default: ""
        type: string
      publish_repository:
        description: "Where to publish after the crate is verified"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - crates-io

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PIP_NO_CACHE_DIR: "1"
  WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}

jobs:
  # Resolve the source once, so that the commit the build jobs verify is the one published even
  # when the input names a branch.
  check_release:
    name: Check release metadata
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up release metadata Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true

      - id: source
        name: Resolve source commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare matching release metadata
        shell: bash
        run: &prepare_release_metadata |
          uv pip install tomlkit setuptools-scm
          python ci/wheel/prepare_release_metadata.py
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          main = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          crate = tomllib.loads(Path("rust/Cargo.toml").read_text(encoding="utf-8"))
          tvm_ffi = crate["dependencies"]["tvm-ffi"]
          tvm_ffi = tvm_ffi["version"] if isinstance(tvm_ffi, dict) else tvm_ffi
          # A caret requirement on a tvm-ffi release such as 0.1.15-post2, a SemVer pre-release,
          # would select an older release such as 0.1.15.
          if not tvm_ffi.startswith("="):
              raise SystemExit(f"rust/Cargo.toml must pin tvm-ffi exactly, not to {tvm_ffi!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as env:
              env.write(f"RELEASE_VERSION={main['project']['version']}\n")
              env.write(f"CRATE_VERSION={crate['package']['version']}\n")
              env.write(f"TVM_FFI_VERSION={tvm_ffi[1:]}\n")
          PY

      # The crate depends on the crates.io release of the tvm-ffi the wheels are built with.
      - name: Check the tvm-ffi release
        shell: bash
        run: |
          tag="v${TVM_FFI_VERSION}"
          submodule=$(git ls-tree HEAD 3rdparty/tvm-ffi | awk '{print $3}')
          # An annotated tag lists the commit it points to as "<tag>^{}", after the tag itself.
          release=$(git ls-remote https://github.com/apache/tvm-ffi "refs/tags/${tag}" "refs/tags/${tag}^{}" |
            sort -k2 | tail -n 1 | cut -f1)
          if [[ "${submodule}" != "${release}" ]]; then
            echo "::error::3rdparty/tvm-ffi is at ${submodule}, but the crate depends on tvm-ffi ${TVM_FFI_VERSION}, whose tag ${tag} is at ${release:-no commit}"
            exit 1
          fi
          echo "Crate tvm-tirx ${CRATE_VERSION} for wheel ${RELEASE_VERSION}, with tvm-ffi ${TVM_FFI_VERSION} at ${release}"

  build_crate:
    name: ${{ matrix.name }}
    needs: [check_release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Download the wheels of another workflow run.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the platforms in sync with the wheels of publish_wheel.yml.
        include:
          - name: "Linux x86_64 crate test"
            os: ubuntu-latest
            artifact_suffix: linux-x86_64-manylinux_2_28
          - name: "Linux aarch64 crate test"
            os: ubuntu-24.04-arm
            artifact_suffix: linux-aarch64-manylinux_2_28
          - name: "macOS arm64 crate test"
            os: macos-14
            artifact_suffix: macos-arm64
          - name: "Windows AMD64 crate test"
            os: windows-2022
            artifact_suffix: windows-amd64
          - name: "Windows ARM64 crate test"
            os: windows-11-arm
            artifact_suffix: windows-arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.check_release.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up release metadata Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Prepare matching release metadata
        shell: bash
        run: *prepare_release_metadata

      - name: Download TIRx wheel
        if: ${{ inputs.wheel_run_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: tirx-wheel-${{ matrix.artifact_suffix }}
          path: wheelhouse
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}

      # The build scripts of the crate and tvm-ffi-sys find the libraries through the
      # tvm-tirx-config and tvm-ffi-config of these packages.
      - name: Install TIRx and TVM FFI
        shell: bash
        run: |
          if [[ -n "${WHEEL_RUN_ID}" ]]; then
            tirx=(wheelhouse/*.whl)
          else
            tirx=("apache-tvm-tirx==${RELEASE_VERSION}")
          fi
          uv pip install "${tirx[@]}" "apache-tvm-ffi==${TVM_FFI_VERSION}"
          python - <<'PY'
          import os
          from importlib.metadata import version

          from packaging.version import Version

          installed = version("apache-tvm-tirx")
          if Version(installed) != Version(os.environ["RELEASE_VERSION"]):
              raise SystemExit(f"installed apache-tvm-tirx {installed}, not {os.environ['RELEASE_VERSION']}")
          PY

      - name: Set up Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Test crate
        working-directory: rust
        run: cargo +stable test --release

      # Packages and verifies the crate; only the release metadata edits above are uncommitted.
      - name: Dry-run crate publication
        working-directory: rust
        run: cargo +stable publish --dry-run --registry crates-io --allow-dirty

      # The dry run keeps its .crate file in a temporary directory; write it out again, without
      # re-verifying, for the artifact upload.
      - name: Package crate
        working-directory: rust
        run: cargo +stable package --registry crates-io --allow-dirty --no-verify

      - name: Upload crate artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-crate-${{ matrix.artifact_suffix }}
          path: rust/target/package/*.crate
          if-no-files-found: error

  upload_crate:
    name: Upload crate to crates.io
    needs: [check_release, build_crate]
    if: ${{ inputs.publish_repository == 'crates-io' }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.check_release.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up release metadata Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Prepare matching release metadata
        shell: bash
        run: *prepare_release_metadata

      - name: Set up Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal

      # The build jobs verified this commit on every platform; packaging it again without
      # verification needs no TIRx installation. Skipping a version already on crates.io lets a
      # failed run be repeated. Needs a crates.io token with publish access to tvm-tirx.
      - name: Publish crate to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Looked up outside rust/, so that cargo asks the registry rather than the local package.
          if lookup=$(cargo +stable info --registry crates-io "tvm-tirx@${CRATE_VERSION}" 2>&1); then
            echo "tvm-tirx@${CRATE_VERSION} is already on crates.io; skipping."
            exit 0
          elif ! grep -q "could not find" <<< "${lookup}"; then
            # Only a definite "not found" may fall through to publishing.
            echo "${lookup}"
            echo "::error::Could not determine whether tvm-tirx@${CRATE_VERSION} is on crates.io"
            exit 1
          fi
          echo "Publishing tvm-tirx@${CRATE_VERSION}"
          cargo +stable publish --manifest-path rust/Cargo.toml --registry crates-io --allow-dirty --no-verify
